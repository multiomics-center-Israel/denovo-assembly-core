server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local stack: no basic auth. Track files are served from /data (bind-mounted).
    # Inject the agent chat widget into the JBrowse page just before </body>.
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</body>' '<script src="/chat/widget.js"></script></body>';

    location / {
        try_files $uri $uri/ /index.html;
    }
}
