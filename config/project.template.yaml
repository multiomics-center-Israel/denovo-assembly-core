# denovo-assembly-core project configuration template.
# Copy this file into your project directory as `project.yaml` and edit.
# Relative paths under `inputs:` and `kraken2.db` are resolved against `project.dir`.

project:
  dir: /path/to/project              # absolute path; outputs are written under this dir
  threads: 16

species:
  display_name: "Genus species"      # used in report titles, e.g. "Spalangia cameroni"
  short_name:   "G. species"         # short form used in section headers
  slug:         genome               # filesystem-safe; used in output filenames (e.g. "<slug>_asm.p_ctg.fa")

sample:
  id: SAMPLE_ID                       # used in report subtitle

conda:
  env: genome_assembly                # conda env that has hifiasm/flye/etc installed

inputs:
  pacbio_reads: reads/sample.fastq                      # PacBio HiFi (relative to project.dir or absolute)
  illumina_r1:  reads/sample_R1.fastq.gz                # Illumina paired R1
  illumina_r2:  reads/sample_R2.fastq.gz                # Illumina paired R2

kraken2:
  db:     qc/kraken2/pluspf_08gb     # auto-downloaded if missing; KRAKEN2_DB env overrides
  db_url: https://genome-idx.s3.amazonaws.com/kraken/k2_pluspf_08gb_20240904.tar.gz

rnaseq:
  sra:           SRRxxxxxxx          # public SRA run for annotation; set to null to skip 7.2-7.5
  bioproject:    PRJNAxxxxxx
  tsa_accession: GBxxxxxxxxxx
  tsa_range:     GBxxxxxxxxxx-GBxxxxxxxxxx

notification:
  enabled:    true
  smtp_host:  smtp.example.org
  smtp_port:  25
  from_addr:  pipeline@example.org
  to_addr:    you@example.org

report:
  pptx_filename: null                # path to a PPTX deck under project.dir, or null to skip
